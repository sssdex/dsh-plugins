# dsh-power-off 自带的 bundle 层。
# 只要 profile 的 package.json 把 dsh-power-off 列进 dsh.profile.bundles，
# 这一层就会被自动挂载，无需手工改 profile 的 cordis.patch.yml。
- insert:
    - id: dsh-power-off
      name: dsh-power-off
      config:
        # 系统倒计时秒数：留够时间反悔（shutdown /t N）。默认 60。
        defaultDelaySeconds: 60
        # 允许的范围，模型工具与 HTTP 都会被夹在这个区间内。
        minDelaySeconds: 10
        maxDelaySeconds: 3600
        # true：shutdown /f，强制结束阻止关机的程序（否则可能卡在确认界面让自动化白做）。
        force: true
        # 是否注册模型工具 shutdown_computer（AI 可以直接调用）。
        allowModelTool: true
        # true：只演练不真关机，日志里记录将要执行的命令。首次验证请先设 true。
        dryRun: false
