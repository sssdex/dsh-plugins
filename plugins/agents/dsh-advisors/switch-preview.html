<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>顾问开关 vs 宿主 Switch</title>
<style>
*{box-sizing:border-box}
:root{
  --dsw-alias-border-l1:#33363b;
  --dsw-alias-border-l3:#2e3135;
  --dsw-alias-brand-primary:#4d7cfe;
  --dsw-alias-switch-thumb:#e9e9e9;
  --dsw-alias-label-primary-foreground:#ffffff;
  --dsw-alias-label-primary:#e9e9e9;
  --dsw-alias-label-secondary:#a8adb5;
  --dsw-alias-state-business-primary:#4176e6;
  --dsw-focus-ring-width:2px;
  --dsw-focus-ring-color:#4176e6;
  --dsw-radius-md:8px;
}
body{margin:0;background:#191b1e;color:#e9e9e9;font:13px/1.5 Inter,system-ui,"Segoe UI",sans-serif;padding:20px 24px 32px}
h2{font-size:12px;color:#a8adb5;margin:0 0 10px;font-weight:600}
.cols{display:flex;gap:36px;align-items:flex-start;margin-bottom:8px}
.col{min-width:220px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px;padding:0 8px;border-radius:var(--dsw-radius-md);color:var(--dsw-alias-label-primary);font-size:13px;line-height:20px;max-width:230px}
.slot{display:flex;align-items:center;justify-content:center;width:36px;height:20px}
.out{font-size:11px;color:#7f848c;margin:10px 0 0;white-space:pre;font-variant-numeric:tabular-nums}
.bad{color:#e05555}
.okc{color:#3fb950}
</style>
<style>/* ===== 左：宿主原生 Switch（照抄 asar 里的真实规则） ===== */

.host-switch{box-sizing:border-box;position:relative;flex:0 0 auto;width:36px;height:20px;padding:2px;border:0;border-radius:999px;corner-shape:round;background:var(--dsw-alias-border-l3);cursor:pointer}
.host-switch[aria-checked=true]{background:var(--dsw-alias-brand-primary)}
.host-switch:disabled{cursor:default;opacity:.5}
.host-switch:focus-visible{outline:var(--dsw-focus-ring-width) solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));outline-offset:2px}
.host-switch[aria-checked=false] .host-thumb{background:var(--dsw-alias-switch-thumb)}
.host-switch[aria-checked=true] .host-thumb{transform:translate(16px)}
.host-thumb{display:block;width:16px;height:16px;border-radius:50%;corner-shape:round;background:var(--dsw-alias-label-primary-foreground);transition:transform .12s ease}

/* ===== 右：顾问插件改后的开关（从 client.js 原样抽取） ===== */
.dsh-advisors-switch{box-sizing:border-box;position:relative;flex:0 0 auto;width:36px;height:20px;padding:2px;border:0;border-radius:999px;corner-shape:round;background:var(--dsw-alias-border-l3);cursor:pointer}
.dsh-advisors-switch[aria-checked=true]{background:var(--dsw-alias-brand-primary)}
.dsh-advisors-switch:disabled{cursor:default;opacity:.5}
.dsh-advisors-switch:focus-visible{outline:var(--dsw-focus-ring-width) solid var(--dsw-focus-ring-color,var(--dsw-alias-state-business-primary));outline-offset:2px}
.dsh-advisors-switch[aria-checked=false] .dsh-advisors-switch-thumb{background:var(--dsw-alias-switch-thumb)}
.dsh-advisors-switch[aria-checked=true] .dsh-advisors-switch-thumb{transform:translate(16px)}
.dsh-advisors-switch-thumb{display:block;width:16px;height:16px;border-radius:50%;corner-shape:round;background:var(--dsw-alias-label-primary-foreground);transition:transform .12s ease}

</style></head><body>

<div class="cols">
  <div class="col"><h2>宿主原生 Switch（团队协作）</h2>
    <div class="rowline"><span>host-off</span><span class="slot"><button type="button" role="switch" aria-checked="false" class="host-switch" data-k="host-off"><span class="host-thumb" aria-hidden="true"></span></button></span></div>
    <div class="rowline"><span>host-on</span><span class="slot"><button type="button" role="switch" aria-checked="true" class="host-switch" data-k="host-on"><span class="host-thumb" aria-hidden="true"></span></button></span></div>
  </div>
  <div class="col"><h2>顾问开关（改后）</h2>
    <div class="rowline"><span>adv-off</span><span class="slot"><button type="button" role="switch" aria-checked="false" class="dsh-advisors-switch" data-k="adv-off"><span class="dsh-advisors-switch-thumb" aria-hidden="true"></span></button></span></div>
    <div class="rowline"><span>adv-on</span><span class="slot"><button type="button" role="switch" aria-checked="true" class="dsh-advisors-switch" data-k="adv-on"><span class="dsh-advisors-switch-thumb" aria-hidden="true"></span></button></span></div>
  </div>
</div>

<p class="out" id="out"></p>

<script>
// 等过渡结束再采样，否则 transform 可能取到中间值
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const R = (el) => el.getBoundingClientRect()
const cs = (el, p) => getComputedStyle(el)[p]

;(async () => {
  await sleep(300)
  const rows = ['host-off', 'adv-off', 'host-on', 'adv-on']
  const data = {}
  for (const k of rows) {
    const btn = document.querySelector('[data-k="' + k + '"]')
    const thumb = btn.firstElementChild
    const b = R(btn), th = R(thumb)
    data[k] = {
      轨道: Math.round(b.width) + '×' + Math.round(b.height),
      padding: cs(btn, 'padding'),
      radius: cs(btn, 'borderRadius'),
      轨道底色: cs(btn, 'backgroundColor'),
      轨道阴影: cs(btn, 'boxShadow') === 'none' ? 'none' : cs(btn, 'boxShadow'),
      thumb: Math.round(th.width) + '×' + Math.round(th.height),
      thumb底色: cs(thumb, 'backgroundColor'),
      thumb阴影: cs(thumb, 'boxShadow') === 'none' ? 'none' : cs(thumb, 'boxShadow'),
      thumb位移: Math.round(th.left - b.left) + 'px',
      thumb相对轨道: (th.left - b.left).toFixed(2) + 'px',
    }
  }

  const pairs = [['host-off', 'adv-off', 'OFF'], ['host-on', 'adv-on', 'ON']]
  const lines = []
  let allSame = true
  for (const [a, b, label] of pairs) {
    lines.push('── ' + label + ' 态 ──')
    for (const key of Object.keys(data[a])) {
      const va = data[a][key], vb = data[b][key]
      const same = String(va) === String(vb)
      if (!same) allSame = false
      lines.push('  ' + key.padEnd(12, '　') + ' 宿主 ' + String(va).padEnd(22) + (same ? '✓' : '✗') + ' 顾问 ' + vb)
    }
  }
  lines.push('')
  lines.push(allSame ? '=> 四项全部一致：顾问开关与宿主 Switch 像素等价' : '=> 存在差异，见上面的 ✗')
  const out = document.getElementById('out')
  out.textContent = lines.join('\n')
  out.className = 'out ' + (allSame ? 'okc' : 'bad')
  document.title = allSame ? 'MATCH' : 'DIFF'
})()
</script></body></html>
