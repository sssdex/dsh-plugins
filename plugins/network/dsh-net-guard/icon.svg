<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Network self-heal">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#12b3a4"/>
    </linearGradient>
  </defs>
  <!-- 断开的链路：左半段 -->
  <path d="M6 32h14" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>
  <!-- 断点 -->
  <circle cx="24" cy="32" r="4" fill="none" stroke="#c2410c" stroke-width="3"/>
  <!-- 自愈后的新链路 -->
  <path d="M30 32h28" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  <!-- 节点 -->
  <circle cx="10" cy="32" r="5" fill="#c2410c"/>
  <circle cx="56" cy="32" r="6" fill="url(#g)"/>
  <!-- 修复标记 -->
  <path d="M38 22l4 4 8-8" fill="none" stroke="#12b3a4" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
